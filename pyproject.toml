[project]
name = "bgmap"
version = "0.1.0"
description = "An interactive 2D map of ranked BoardGameGeek games, placed by the meaning of their descriptions."
requires-python = ">=3.12"
dependencies = [
    "requests",
    "lxml",
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn>=1.3",
    "umap-learn",
    "datamapplot",
    "anthropic",
]

[project.optional-dependencies]
# Install torch with CUDA first (see README), then this extra.
embed = ["sentence-transformers>=3"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
