<style>
/*FONTFACES*/
:root { --bg: #0b0807; --ink: #f3e6d0; --muted: #b39c80; --amber: #ffb547; --red: #c8102e; --cream: #efe6d2; --dark: #2a1a14; }
* { box-sizing: border-box; }
body { margin: 0; background: #141010; color: var(--ink); font: 15px/1.5 "Work Sans", system-ui, sans-serif; padding: 32px; }
header { max-width: 1500px; margin: 0 auto 26px; display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
header h1 { margin: 0; font: 400 40px/1 "Limelight", serif; text-transform: uppercase; letter-spacing: .05em; color: var(--amber); }
header p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.tag { font: 600 13px "Oswald", sans-serif; letter-spacing: .14em; text-transform: uppercase; border: 1px solid rgba(255,181,71,.45); color: var(--amber); padding: 6px 10px; }
.grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 26px; }
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
figure { margin: 0; }
.cell { position: relative; aspect-ratio: 1 / 1; container-type: inline-size; overflow: hidden; background: var(--bg); border: 1px solid #2c2420; }
.cell .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cell .dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(11,8,7,.15), rgba(11,8,7,.75)); }
.cell .beam { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 95% at 50% -12%, rgba(255,196,120,.18), transparent 70%); }
/* Caption keep-out band: the burned-in captions live in the bottom 17%. */
.cap { position: absolute; left: 6cqw; right: 6cqw; bottom: 4.5cqw; height: 9cqw; display: grid; place-items: center; text-align: center;
  font: 600 4.1cqw/1.15 "Work Sans", sans-serif; color: var(--ink); background: rgba(11,8,7,.72); outline: 1px dashed rgba(255,181,71,.35); padding: 0 3cqw; }
.eyebrow { font: 600 3cqw/1 "Oswald", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
.lime { font-family: "Limelight", serif; text-transform: uppercase; letter-spacing: .05em; font-weight: 400; }
.mono { font-family: "Courier Prime", monospace; }
figcaption { padding-top: 10px; }
.row { display: flex; justify-content: space-between; font: 600 13px "Oswald", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.row span:last-child { color: var(--muted); }
.note { margin: 6px 0 8px; color: #d9c8ae; font-size: 14px; }
.chip { display: inline-block; font: 600 11px "Oswald", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--bg); background: var(--amber); padding: 3px 8px; }
.ticket { position: absolute; background: var(--cream); color: var(--dark); border-radius: 1.4cqw; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 5cqw; height: 5cqw; margin-top: -2.5cqw; border-radius: 50%; background: var(--bg); }
.ticket::before { left: -2.5cqw; } .ticket::after { right: -2.5cqw; }
.poster { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border: .6cqw solid var(--dark); }
.panel { position: absolute; background: rgba(26,17,12,.9); border: 1px solid rgba(255,181,71,.38); }
.block { border: 1px dashed rgba(255,181,71,.5); color: var(--muted); display: grid; place-items: center; text-align: center; font: 600 2.6cqw "Oswald", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.seams { display: flex; flex-direction: column; justify-content: center; gap: 2.2cqw; padding: 6cqw; }
.seam { display: grid; grid-template-columns: 20cqw 1fr; align-items: center; font: 600 4.6cqw "Oswald", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
.seam b { color: var(--amber); font-family: "Courier Prime", monospace; font-size: 4.6cqw; }
.tokens { padding: 6cqw; display: flex; flex-direction: column; gap: 1.6cqw; }
.sw { display: flex; gap: 2cqw; } .sw div { width: 16cqw; height: 16cqw; border: 1px solid #3a302a; font: 3.2cqw "Courier Prime"; display: flex; align-items: end; padding: 1cqw; }
</style>
</head>

<header>
  <div>
    <h1>Massive Movie Map · storyboard v2</h1>

  </div>
  <span class="tag">1080×1080 · ~52s · 9 frames</span>
</header>
