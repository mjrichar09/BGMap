<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE paper card — heavy 1.5px brown-black ink rule + a 4px tomato-red leftbar
     (bold poster's cantilevered red-leftbar-card signature), square corners, NO
     drop shadow (the only shadow in the system is the stacked text-shadow on red) */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: var(--cap-canvas, #ffffff);
    border: 1.5px solid var(--cap-ink, #1c1410);
    border-left: 4px solid var(--cap-accent, #d8000f);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Work Sans", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.01em;
  }

  /* upcoming — faint brown-black ink, no panel */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #1c1410) 42%, var(--cap-canvas, #ffffff));
  }
  /* current word — THE tomato-red panel (box-shadow spread = a hard square block
     w/o layout shift; no blur), paper-white reading on top carrying the stacked
     text-shadow — bold poster's surface-inversion + only-shadow signatures */
  .caption-word.is-active {
    color: var(--cap-canvas, #ffffff);
    background: var(--cap-accent, #d8000f);
    box-shadow: 0 0 0 0.06em var(--cap-accent, #d8000f);
    text-shadow:
      0.03em 0.03em 0 rgba(28, 20, 16, 0.25),
      0.06em 0.06em 0 rgba(28, 20, 16, 0.2),
      0.09em 0.09em 0 rgba(28, 20, 16, 0.15);
  }
  /* already spoken — solid brown-black ink, panel cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1c1410);
    background: transparent;
    box-shadow: none;
    text-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Shrikhand display, bold poster's display face inflection */
  .caption-word.cap-brand {
    font-family: "Work Sans", Georgia, serif;
  }
  /* numerals / data — the mono chrome voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Work Sans", ui-monospace, monospace;
    color: color-mix(in srgb, var(--cap-ink, #1c1410) 72%, var(--cap-canvas, #ffffff));
  }
  /* emphasis — a tomato-red em-dash-weight underline (the lone accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #f5f2ef);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }

  /* Massive Movie Map override (Late Show): the injected tokens map ink and canvas to the same
     near-black, so the caption colours are fixed here. Dark translucent card, cream words,
     amber current word with dark text, Work Sans for reading speed. */
  .caption-pill { background: rgba(11, 8, 7, 0.84); border: 1px solid rgba(255, 181, 71, 0.45); border-left: 4px solid #FFB547; }
  .caption-line { font-family: "Work Sans", system-ui, sans-serif; font-weight: 600; font-size: 46px; letter-spacing: 0; }
  .caption-word { color: rgba(243, 230, 208, 0.55); }
  .caption-word.is-active { color: #1A0F06; background: #FFB547; box-shadow: 0 0 0 0.08em #FFB547; text-shadow: none; }
  .caption-word.is-spoken { color: #F3E6D0; }

  /* Calm subtitles: every word cream, no highlight; up to two lines per phrase. */
  .caption-pill { max-width: 88%; padding: 16px 34px 18px; }
  .caption-line { font-size: 40px; line-height: 1.22; gap: 0 0.28em; }
  .caption-word, .caption-word.is-active, .caption-word.is-spoken { color: #F3E6D0; background: none; box-shadow: none; text-shadow: none; }
