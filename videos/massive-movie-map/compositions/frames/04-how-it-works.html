<script>
(function () {
  window.__timelines = window.__timelines || {};
  var DUR = 4.02;
  var tl = gsap.timeline({ paused: true });

  // word cues (frame-local seconds)
  var T_PLOT = 0.36, T_BECOMES = 0.64, T_THOUSAND = 1.14, T_THOSE = 2.12, T_NUMBERS2 = 2.52, T_MAP = 3.28;

  // ── macro camera: a slow, quiet push under the whole shot
  tl.fromTo("#f04-stage", { scale: 1.0 }, { scale: 1.025, duration: DUR, ease: "none" }, 0);

  // ── Scene 1: eyebrow + plot card
  tl.fromTo("#f04-head", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.0);
  tl.fromTo("#f04-head-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
  tl.fromTo("#f04-plot", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T_PLOT - 0.08);

  // ── arrows: svg path draw (dash offset)
  function drawArrow(id, at) {
    var shaft = document.getElementById(id + "-shaft");
    var head = document.getElementById(id + "-head");
    var ls = 48, lh = 40; // fixed path lengths (+ small margin) — no layout read needed
    gsap.set(shaft, { strokeDasharray: ls, strokeDashoffset: ls });
    gsap.set(head, { strokeDasharray: lh, strokeDashoffset: lh });
    tl.fromTo(shaft, { strokeDashoffset: ls }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.in" }, at);
    tl.fromTo(head, { strokeDashoffset: lh }, { strokeDashoffset: 0, duration: 0.2, ease: "power3.out" }, at + 0.24);
  }

  // ── Scene 2: arrow 1 on "becomes", strip frame + label, numbers tick in from "thousand"
  drawArrow("f04-arrow1", T_BECOMES);
  tl.fromTo("#f04-nums", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T_BECOMES + 0.22);
  tl.fromTo("#f04-nums-label", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, T_BECOMES + 0.34);

  var FINAL = ["0.031", "−0.112", "0.087", "0.004", "−0.046", "0.129", "−0.071", "0.018", "−0.093", "…"];
  var LINE_GAP = 0.085;   // top-to-bottom stagger
  var FLICKER = 0.24;     // each line scrambles before it lands
  var STEP = 1 / 15;      // scramble state changes ~15x per second (discrete)
  var numEls = FINAL.map(function (_, i) { return document.getElementById("f04-num-" + i); });

  function hash(a, b) {
    var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function scrambled(i, k) {
    var v = Math.floor(hash(i, k) * 200);
    var s = (v / 1000).toFixed(3);
    return (hash(k, i + 7) > 0.5 ? "−" : "") + s;
  }
  function textAt(i, t) {
    var start = T_THOUSAND + i * LINE_GAP;
    if (t < start) return "";
    if (i === FINAL.length - 1) return FINAL[i];
    if (t >= start + FLICKER) return FINAL[i];
    var k = Math.floor((t - start) / STEP);
    return scrambled(i, k);
  }
  var driver = { t: 0 };
  tl.to(driver, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: function () {
      for (var i = 0; i < numEls.length; i++) {
        var s = textAt(i, driver.t);
        if (numEls[i].textContent !== s) numEls[i].textContent = s;
      }
    }
  }, 0);
  // strip "lights" as the numbers land
  tl.fromTo("#f04-nums", { borderColor: "rgba(255,181,71,0.45)" }, { borderColor: "rgba(255,181,71,0.9)", duration: 0.4, ease: "power2.out" }, T_THOUSAND);
  tl.to("#f04-nums", { borderColor: "rgba(255,181,71,0.45)", duration: 0.5, ease: "power2.inOut" }, T_THOSE);

  // ── Scene 3: arrow 2 on "Those", map station reveals, dot drops on "map."
  drawArrow("f04-arrow2", T_THOSE);
  tl.fromTo("#f04-map", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T_THOSE + 0.22);
  tl.fromTo("#f04-map-img", { scale: 1.12 }, { scale: 1.0, duration: 1.6, ease: "power3.out" }, T_THOSE + 0.22);
  tl.fromTo("#f04-map-label", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, T_NUMBERS2);

  // dot drops into the cloud (no bounce) and the glow blooms as one beat with its settle
  tl.fromTo("#f04-dot", { y: -190, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.38, ease: "power3.out" }, T_MAP - 0.06);
  var BLOOM_START = T_MAP - 0.02, BLOOM_DUR = 0.5, PEAK = 0.4;
  tl.fromTo("#f04-glow", { opacity: 0, scale: 0.85 }, { opacity: PEAK, scale: 1, duration: BLOOM_DUR, ease: "power2.out" }, BLOOM_START);
  // bounded breathe through the hold (finite phase tween, no repeat)
  var glow = document.getElementById("f04-glow");
  var phase = { p: 0 };
  var BREATHE_START = BLOOM_START + BLOOM_DUR;
  var BREATHE_DUR = DUR - BREATHE_START;
  tl.to(phase, {
    p: Math.PI * 2 * (BREATHE_DUR / 2.6), duration: BREATHE_DUR, ease: "none",
    onUpdate: function () {
      var s = Math.sin(phase.p);
      glow.style.opacity = String(PEAK + s * 0.03);
      glow.style.transform = "scale(" + (1 + s * 0.02) + ")";
    }
  }, BREATHE_START);

  window.__timelines["04-how-it-works"] = tl;
})();
</script>
