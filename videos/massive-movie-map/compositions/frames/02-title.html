<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var root = document.querySelector('[data-composition-id="02-title"]');
  var q = function (id) { return root.querySelector('[id="' + id + '"]'); };
  var tl = gsap.timeline({ paused: true });

  // ---- Overlays: seam from frame 1 stays invisible (uniform 50% -> composite ~55%, darker at centre)
  tl.fromTo(q('02-title-dim'), { opacity: 0.6 }, { opacity: 0.55, duration: 0.4, ease: 'power2.out' }, 0);
  tl.fromTo(q('02-title-vignette'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0);

  // ---- Scene 1: eyebrow types on word by word to the VO
  //      An@0.00 AI@0.28 read@0.58 every@0.96 plot,@1.24 -> fully typed by 1.22
  var eyebrow = q('02-title-eyebrow');
  var words = ['AN', 'AI', 'READ', 'EVERY', 'PLOT'];
  var wordStarts = [0.001, 0.24, 0.46, 0.74, 1.00];
  var STEP = 0.045;
  var chars = [];
  words.forEach(function (w, wi) {
    if (wi > 0) eyebrow.appendChild(document.createTextNode(' '));
    for (var i = 0; i < w.length; i++) {
      var s = document.createElement('span');
      s.textContent = w[i];
      eyebrow.appendChild(s);
      chars.push({ el: s, t: wordStarts[wi] + i * STEP });
    }
  });
  tl.set(chars.map(function (c) { return c.el; }), { opacity: 0 }, 0);
  chars.forEach(function (c) { tl.set(c.el, { opacity: 1 }, c.t); });

  // ---- Scene 2: title rises in per word, starting on "plot,"@1.24
  var titleWords = Array.prototype.slice.call(root.querySelectorAll('[class~="02-title-word"]'));
  var titleStarts = [1.24, 1.44, 1.62];
  titleWords.forEach(function (el, i) {
    tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, titleStarts[i]);
  });

  // ---- Scene 3: subline fades up on "similar"@2.14, then holds still
  tl.fromTo(q('02-title-sub'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.14);

  // barely-perceptible push across the whole card (the turning cloud carries the life)
  tl.fromTo(q('02-title-stack'), { scale: 1 }, { scale: 1.02, duration: 4.276, ease: 'none' }, 0);

  window.__timelines['02-title'] = tl;
})();
</script>
