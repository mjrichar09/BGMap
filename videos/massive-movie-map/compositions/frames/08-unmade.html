<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.querySelector('[data-composition-id="08-unmade"]');
  var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

  // Split a string into per-character spans (typed on via tl.set — deterministic, seek-safe).
  function chars(el, text, withCaret) {
    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement("span");
      s.className = "08-unmade-ch";
      s.textContent = text[i] === " " ? "\u00a0" : text[i];
      el.appendChild(s);
      spans.push(s);
    }
    var caret = null;
    if (withCaret) {
      caret = document.createElement("span");
      caret.className = "08-unmade-caret";
      el.appendChild(caret);
    }
    return { spans: spans, caret: caret };
  }

  var eb1 = chars(byId("08-unmade-eb1"), "Want something original?", true);
  var eb2 = chars(byId("08-unmade-eb2"), "Unmade movie", true);
  var tag = chars(byId("08-unmade-tag"), "117 AD / 2017", false);

  var tl = gsap.timeline({ paused: true });

  // Caret states (opacity set discretely; blink = finite set toggles, no repeat).
  function blink(caret, from, to, period) {
    var on = true;
    for (var t = from; t < to; t += period / 2) {
      tl.set(caret, { opacity: on ? 1 : 0 }, t);
      on = !on;
    }
    tl.set(caret, { opacity: 0 }, to);
  }
  tl.set([].concat(eb1.spans, eb2.spans, tag.spans, [eb1.caret, eb2.caret]), { opacity: 0 }, 0);

  // Scene 1 — "Want"@0.00: eyebrow types on.
  var step = 0.05;
  eb1.spans.forEach(function (s, i) { tl.set(s, { opacity: 1 }, 0.02 + i * step); });
  tl.set(eb1.caret, { opacity: 1 }, 0.02);
  blink(eb1.caret, 0.02 + eb1.spans.length * step, 2.70, 0.5);

  // "nobody"@2.70: hard-cut swap in place to UNMADE MOVIE.
  tl.set(eb1.spans, { opacity: 0 }, 2.70);
  tl.set(eb1.caret, { opacity: 0 }, 2.70);
  eb2.spans.forEach(function (s) { tl.set(s, { opacity: 1 }, 2.70); });
  tl.set(eb2.caret, { opacity: 1 }, 2.70);
  blink(eb2.caret, 2.70, 4.40, 0.5);

  // Scene 2 — "Roman"@5.02: title lands.
  tl.fromTo(byId("08-unmade-title"),
    { opacity: 0, y: 26 },
    { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.02);

  // "Syrian"@6.36: pairing line fades in.
  tl.fromTo(byId("08-unmade-pair"),
    { opacity: 0, y: 14 },
    { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.36);

  // Scene 3 — "nineteen"@8.98: Courier tag types on, then hold.
  tag.spans.forEach(function (s, i) { tl.set(s, { opacity: 1 }, 8.98 + i * 0.055); });

  // Quiet settle under the whole block so the hold isn't frozen (no exit).
  tl.fromTo(byId("08-unmade-block"), { y: 0 }, { y: -6, duration: 10.74, ease: "none" }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines["08-unmade"] = tl;
})();
</script>
