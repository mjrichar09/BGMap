#root {
  position: relative;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  container-type: size;

}
.\30 1-count-layer { position: absolute; inset: 0; pointer-events: none; }

/* overall dim on the footage, settles at 50% for the handoff to frame 2 */

/* soft radial dim behind the counter for legibility (sketch: ellipse 55% 30% at 50% 47%) */

  background: radial-gradient(ellipse 72% 40% at 50% 45%, rgba(11,8,7,.94), rgba(11,8,7,.7) 55%, rgba(11,8,7,.25) 100%);
  opacity: 0;
}

/* faint projector beam from the top */
#\30 1-count-beam {
  background: radial-gradient(ellipse 60% 95% at 50% -12%, rgba(255,196,120,.18), transparent 70%);
  opacity: 0;
}

/* counter block: top 34cqw, centered */
#\30 1-count-stack {
  position: absolute;
  left: 0;
  right: 0;
  top: 34cqw;
  text-align: center;

<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  function q(id) { return document.getElementById(id); }
  var numEl = q("01-count-number");
  var TARGET = 36841;
  var COUNT_AT = 1.00;              // "Thirty-six"
  var LAND_AT = 2.72;               // "forty-one"
  var COUNT_DUR = LAND_AT - COUNT_AT;
  var FILMS_AT = 3.30;              // "films."
  var START_SCALE = 0.6;            // value-scaled counter: grows 60% -> 100%

  function fmt(n) {
    // deterministic comma grouping (no locale dependence)
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  // Scene 1 (0-1.0s): cold open, the cloud fades up from black; beam comes up with it
  tl.fromTo(q("01-count-black"), { opacity: 1 }, { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 0);
  tl.fromTo(q("01-count-beam"), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);

  // Scene 2 (1.0-3.3s): dim settles behind the counter; counter rolls 0 -> 36,841, landing on "forty-one"
  tl.fromTo(q("01-count-dim"), { opacity: 0 }, { opacity: 0.6, duration: 0.8, ease: "power3.out" }, COUNT_AT - 0.1);
  tl.fromTo(q("01-count-radial"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power3.out" }, COUNT_AT - 0.1);

  var state = { value: 0 };
  tl.fromTo(state, { value: 0 }, {
    value: TARGET,
    duration: COUNT_DUR,
    ease: "power2.out",
    onUpdate: function () {
      numEl.textContent = fmt(Math.round(state.value));
    }
  }, COUNT_AT);
  tl.fromTo(numEl, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, COUNT_AT);
  tl.fromTo(numEl, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, COUNT_AT);

  // Scene 3 (3.3-4.38s): FILMS rises in under the number on "films.", then hold still
  tl.fromTo(q("01-count-label"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, FILMS_AT);

  // pad the timeline to the full frame duration (hold)
  tl.set({}, {}, 4.38);

  window.__timelines["01-count"] = tl;
})();
