<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var DURATION = 10.548;
    var tl = gsap.timeline({ paused: true });

    // ---- Scene 1 (0.00–1.24): search box, "GoodFellas" types on, poster drops in ----
    tl.fromTo("#gf03-dim-left", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
    tl.fromTo("#gf03-search", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);

    var typed = document.querySelectorAll("#gf03-typed .gf03-ch");
    var TYPE_START = 0.12, TYPE_END = 0.94;
    tl.set(typed, { opacity: 0 }, 0);
    tl.set("#gf03-placeholder", { opacity: 1 }, 0);
    tl.set("#gf03-placeholder", { opacity: 0 }, TYPE_START);
    var step = (TYPE_END - TYPE_START) / typed.length;
    for (var i = 0; i < typed.length; i++) {
      tl.set(typed[i], { opacity: 1 }, TYPE_START + i * step);
    }
    // caret: solid while typing, then a deterministic blink (explicit sets, no repeat)
    tl.set("#gf03-caret", { opacity: 1 }, 0);
    for (var b = TYPE_END + 0.5, on = false; b < DURATION; b += 0.5, on = !on) {

    tl.fromTo("#gf03-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.05);

      for (var c = 0; c < chars.length; c++) {
        tl.set(chars[c], { opacity: 1 }, r.at + 0.28 + c * 0.09);

    path.style.strokeDasharray = String(len);
    tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 9.22);

    // full-span anchor
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["03-goodfellas"] = tl;
