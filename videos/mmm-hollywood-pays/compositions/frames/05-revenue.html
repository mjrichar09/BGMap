#root {
  position: relative;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  /* transparent: the approved map clip is mounted underneath this frame */
  color: #F3E6D0;
  font-family: "Work Sans", sans-serif;
}
#root * { box-sizing: border-box; }

/* soft dims only where the type sits */
#rev05-dim-title {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1080px;
  background: radial-gradient(ellipse 660px 460px at 0% 0%, rgba(11,8,7,.72), rgba(11,8,7,0) 72%);
  pointer-events: none;
}
#rev05-dim-panel {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1080px;
  background: radial-gradient(ellipse 760px 420px at 66% 58%, rgba(11,8,7,.5), rgba(11,8,7,0) 75%);
  pointer-events: none;
}

/* title block, top-left */
#rev05-title-block {
  position: absolute; left: 56px; top: 52px; width: 720px;
}
#rev05-eyebrow {
  font: 600 26px/1 "Oswald", sans-serif; letter-spacing: 3px; text-transform: uppercase;
  color: #FFB547;
}
#rev05-title {
  margin-top: 14px;
  font: 400 84px/0.95 "Limelight", serif; letter-spacing: 0.06em; text-transform: uppercase;
  color: #F3E6D0; white-space: nowrap;
}
#rev05-legend {
  margin-top: 22px; width: 340px;
