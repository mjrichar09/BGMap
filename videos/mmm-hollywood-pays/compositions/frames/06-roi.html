#root {
  position: relative;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  /* transparent: the approved map clip is mounted underneath this frame */
  color: #F3E6D0;
  font-family: "Work Sans", sans-serif;
}
#root * { box-sizing: border-box; }

/* heavy dim behind the chart (~82%) */
#roi06-dim {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1080px;
  background: rgba(11,8,7,.82);
  pointer-events: none;
}

/* title block, top-left */
#roi06-title-block {
  position: absolute; left: 56px; top: 52px; width: 968px; height: 120px;
}
#roi06-eyebrow {
  font: 600 26px/1 "Oswald", sans-serif; letter-spacing: 3px; text-transform: uppercase;
  color: #FFB547;
}
#roi06-title {
  margin-top: 14px;
  font: 400 56px/1 "Limelight", serif; letter-spacing: 0.06em; text-transform: uppercase;
  color: #F3E6D0; white-space: nowrap;
}

/* chart layer: absolute canvas coordinates */
#roi06-chart {
  position: absolute; left: 0; top: 0; width: 1080px; height: 900px;
}
.roi06-label {
  position: absolute; left: 56px; height: 44px; width: 300px;
  font: 500 30px/44px "Oswald", sans-serif; letter-spacing: 1.5px; text-transform: uppercase;
  color: #F3E6D0; white-space: nowrap;

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var DURATION = 9.14;
    var PX_PER_X = 610 / 6;          // track x 400..1010 spans 0x..6x
    var VAL_W = 4 * 0.6 * 34;        // "5.7×" in Courier Prime 34px
    // stats.json roi_top / roi_bottom
    var ROWS = [
      { roi: 5.7, at: 1.22, dur: 2.0, inside: true },   // James Bond
      { roi: 4.1, at: 4.92, dur: 1.1 },                 // Slashers
      { roi: 4.0, at: 5.17, dur: 1.1 },                 // Korean thrillers
      { roi: 1.1, at: 6.66, dur: 0.8 },                 // Political dramas
      { roi: 0.7, at: 6.91, dur: 0.8 }                  // Apartheid dramas
    ];
    var tl = gsap.timeline({ paused: true });

    // ---- "But"@0.00: dim + title ----
    tl.fromTo("#roi06-dim", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 0);
    tl.fromTo("#roi06-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
    tl.fromTo("#roi06-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.08);

    // ---- "dollar"@0.42: axis + empty tracks ----
    tl.fromTo("#roi06-axis", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.42);
    tl.fromTo(".roi06-tick", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.05 }, 0.55);
    tl.fromTo(".roi06-track", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 0.5);

    // ---- bars: grow from zero, value rides the bar end and counts up ----
    ROWS.forEach(function (r, i) {
      var fill = document.getElementById("roi06-fill-" + i);
      var val = document.getElementById("roi06-val-" + i);
      var full = r.roi * PX_PER_X;
      fill.style.width = full + "px";
      var st = { v: 0 };
      function render() {
        var px = st.v * PX_PER_X;
        fill.style.transform = "scaleX(" + (st.v / r.roi) + ")";
        val.textContent = st.v.toFixed(1) + "×";
        if (r.inside) {
          val.style.transform = "translateX(" + (px - VAL_W - 14) + "px)";
          val.style.opacity = Math.max(0, Math.min(1, (px - VAL_W - 30) / 60));
        } else {
          val.style.transform = "translateX(" + (px + 8) + "px)";
        }
      }
      render();
      tl.fromTo("#roi06-label-" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, r.at - 0.05);
      if (!r.inside) {
        tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, r.at);
      }
      tl.fromTo(st, { v: 0 }, { v: r.roi, duration: r.dur, ease: "power3.out", onUpdate: render }, r.at);
    });

    // ---- posters beside the top bars ----
    tl.fromTo("#roi06-poster-bond", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.22);
    tl.fromTo("#roi06-poster-slash", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.92);

    // ---- "barely"@7.58: break-even line draws at 1x ----
    tl.fromTo("#roi06-be-line", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 7.58);
    tl.fromTo("#roi06-be-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.7);

    // ---- "even."@8.26: soft red glow on the red rows ----
    tl.fromTo(["#roi06-label-3", "#roi06-label-4", "#roi06-val-3", "#roi06-val-4"],
      { textShadow: "0 0 0px rgba(200,16,46,0)" },
      { textShadow: "0 0 18px rgba(200,16,46,0.95)", duration: 0.5, ease: "power2.out" }, 8.26);

    // ---- source line ----
    tl.fromTo("#roi06-source", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.6);

    // hold to the end
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["06-roi"] = tl;
  })();
</script>
