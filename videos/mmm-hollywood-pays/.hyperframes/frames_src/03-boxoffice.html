  // ---- earn@0.92: bars re-scale to box office together; recolor; labels count up

    } else {
      tl.fromTo(b, { backgroundColor: '#FFB547', opacity: 1 }, { backgroundColor: '#B39C80', opacity: 0.7, duration: D_MORPH, ease: EASE }, T_MORPH);
