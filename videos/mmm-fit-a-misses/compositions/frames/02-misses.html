[data-composition-id="02-misses"] { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #F3E6D0; font-family: "Work Sans", sans-serif; }
[data-composition-id="02-misses"] * { box-sizing: border-box; }
[data-composition-id="02-misses"] .clip { position: absolute; }
[data-composition-id="02-misses"] .layer { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

[data-composition-id="02-misses"] .beam { background: radial-gradient(ellipse 75% 50% at 50% -6%, rgba(255,196,120,.14), rgba(255,196,120,0) 70%); }
[data-composition-id="02-misses"] .topdim { background: linear-gradient(to bottom, rgba(11,8,7,.95) 0px, rgba(11,8,7,.75) 430px, rgba(11,8,7,0) 640px); }
[data-composition-id="02-misses"] .botdim { background: linear-gradient(to top, rgba(11,8,7,.92) 0px, rgba(11,8,7,.55) 520px, rgba(11,8,7,0) 720px); }
