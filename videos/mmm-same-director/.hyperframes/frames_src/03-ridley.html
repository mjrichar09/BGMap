#root {
  position: relative;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  /* transparent: the approved map clip is mounted underneath this frame */
  color: #F3E6D0;
}
#root * { box-sizing: border-box; }

/* soft dim behind the top-left name block */
#ridley03-dim-tl {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1080px;
  background: radial-gradient(ellipse 760px 420px at 0% 0%, rgba(11,8,7,.82), rgba(11,8,7,.5) 45%, rgba(11,8,7,0) 75%);
  pointer-events: none;
}

/* name block */
#ridley03-eyebrow {
  position: absolute; left: 60px; top: 60px;
  font: 600 26px/1 "Oswald", sans-serif; letter-spacing: .2em;
  text-transform: uppercase; color: #FFB547; white-space: nowrap;
}
#ridley03-name {
  position: absolute; left: 60px; top: 96px;
  font: 400 76px/1 "Limelight", serif; letter-spacing: .06em;
  text-transform: uppercase; color: #F3E6D0; white-space: nowrap;
}
#ridley03-count {
  position: absolute; left: 62px; top: 192px;
  font: 700 34px/1 "Courier Prime", monospace; letter-spacing: .04em;
  color: #FFB547; white-space: pre;
}
.ridley03-ch { display: inline-block; white-space: pre; }

/* dark translucent strip behind posters + stat */
#ridley03-strip {
