  <div class="clip r05-layer" id="05-ranking-content" data-start="0" data-duration="6.803" data-track-index="1">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function () {
    var FID = "05-ranking";
    var X0 = 390, X1 = 960, V0 = 0.40, V1 = 0.72;
    function xOf(v) { return X0 + (v - V0) / (V1 - V0) * (X1 - X0); }

    var AMBER = "#FFB547", RED = "#FF5A64", MUTED = "#B39C80", INK = "#F3E6D0";

    // inlined from assets/data/stats.json (widest_range / most_typecast)
    var wide = [
      { name: "Benedict Cumberbatch", v: 0.454, s: 0.45 },
      { name: "Cate Blanchett",       v: 0.491, s: 0.49 },
      { name: "Scarlett Johansson",   v: 0.491, s: 0.49 },
      { name: "Matt Damon",           v: 0.493, s: 0.49 },
      { name: "Adam Driver",          v: 0.494, s: 0.49 }
    ];
    var typecast = [
      { name: "Jason Statham",      v: 0.691, s: 0.69 },
      { name: "Paul Walker",        v: 0.608, s: 0.61 },
      { name: "Jennifer Aniston",   v: 0.603, s: 0.60 },
      { name: "Paul Rudd",          v: 0.595, s: 0.60 },
      { name: "Michelle Rodriguez", v: 0.592, s: 0.59 },
      { name: "Vin Diesel",         v: 0.588, s: 0.59 }
    ];

    var root = document.querySelector('[data-composition-id="' + FID + '"]');
    var gWide = root.querySelector(".r05-group-wide");
    var gType = root.querySelector(".r05-group-type");
    var title = root.querySelector(".r05-title");

    function el(tag, cls, parent, css, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (css) for (var k in css) e.style[k] = css[k];
      if (text != null) e.textContent = text;
      parent.appendChild(e);
      return e;
    }

    var rows = [];
    function buildRow(parent, d, top, barColor, barOpacity, valColor, hiColor, tagText) {
      var row = el("div", "r05-row", parent, { top: top + "px" });
      var label = el("div", "r05-label", row, null, d.name);
      var w = xOf(d.v) - X0;
      var glow = null, tag = null;
      if (hiColor) glow = el("div", "r05-glow", row, { width: w + "px", background: hiColor, opacity: "0" });
      var bar = el("div", "r05-bar", row, { width: w + "px", background: barColor, opacity: String(barOpacity) });
      var val = el("div", "r05-val", row, { left: (X0 + w + 10) + "px", color: valColor }, d.s.toFixed(2));
      if (tagText) tag = el("div", "r05-tag", row, { left: (X0 + w + 10) + "px", color: hiColor }, tagText);
      var r = { d: d, w: w, label: label, bar: bar, val: val, glow: glow, tag: tag };
      rows.push(r);
      return r;
    }

    var hWide = el("div", "r05-head", gWide, { top: "170px", color: AMBER }, "WIDEST RANGE");
    var cumber = null;
    wide.forEach(function (d, i) {
      var r = buildRow(gWide, d, 210 + i * 46, AMBER, i === 0 ? 1 : 0.75, AMBER,
        i === 0 ? AMBER : null, i === 0 ? "WIDEST" : null);
      if (i === 0) cumber = r;
    });

    var hType = el("div", "r05-head", gType, { top: "470px", color: RED }, "MOST TYPECAST");
    var statham = null;
    typecast.forEach(function (d, i) {
      var isS = i === 0;
      var r = buildRow(gType, d, 510 + i * 46, isS ? RED : MUTED, isS ? 1 : 0.6, isS ? RED : MUTED,
        isS ? RED : null, isS ? "NARROWEST" : null);
      if (isS) statham = r;
    });

    var tl = gsap.timeline({ paused: true });

    // "Among"@0.00 — title
    tl.fromTo(title, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.0);

    // "stars,"@0.68 — group headings + all bars grow from the 0.40 baseline, staggered top to bottom
    var T_BARS = 0.68, STAG = 0.06, DUR = 0.34;
    tl.fromTo([hWide, hType], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T_BARS);
    rows.forEach(function (r, i) {
      var t = T_BARS + i * STAG;
      tl.fromTo(r.label, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: DUR, ease: "power3.out" }, t);
      tl.fromTo(r.bar, { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: DUR, ease: "power3.out" }, t);
      tl.fromTo(r.val, { x: -r.w, opacity: 0 }, { x: 0, opacity: 1, duration: DUR, ease: "power3.out" }, t);
      var proxy = { v: V0 };
      tl.fromTo(proxy, { v: V0 }, {
        v: r.d.s, duration: DUR, ease: "power3.out",
        onUpdate: function () { r.val.textContent = proxy.v.toFixed(2); }
      }, t);
    });

    function highlight(r, color, t) {
      tl.fromTo(r.label, { color: INK }, { color: color, duration: 0.4, ease: "power3.out" }, t);
      tl.fromTo(r.glow, { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power3.out" }, t);
      tl.fromTo(r.tag, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.08);
    }

    // "Cumberbatch"@1.66 — widest
    highlight(cumber, AMBER, 1.66);
    // "Statham,"@4.40 — narrowest
    highlight(statham, RED, 4.40);

    // hold to the end
    tl.to({}, { duration: 0.01 }, 6.29);

    window.__timelines = window.__timelines || {};
    window.__timelines[FID] = tl;
  })();
